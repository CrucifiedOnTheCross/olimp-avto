server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/olimp_avto
    username: olimp_avto
    password: olimp_avto
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 32MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          ssl:
            enable: ${MAIL_SMTP_SSL:false}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  auctions:
    api-url: ${AVTOJP_API_URL:http://87.242.72.57/gzip/}
    api-ip: ${AVTOJP_API_IP:8.1.1.1}
    api-code: ${AVTOJP_API_CODE:}
    timeout: ${AVTOJP_TIMEOUT:20s}
    dictionary-cache-ttl: ${AVTOJP_DICTIONARY_CACHE_TTL:30m}
    lot-cache-ttl: ${AVTOJP_LOT_CACHE_TTL:10m}
    captcha-threshold: ${AVTOJP_CAPTCHA_THRESHOLD:50}
    captcha-ttl: ${AVTOJP_CAPTCHA_TTL:5m}
    request-threshold: ${AVTOJP_REQUEST_THRESHOLD:40}
    request-window: ${AVTOJP_REQUEST_WINDOW:1m}
  security:
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:admin123}
  mail:
    from: ${APP_MAIL_FROM:noreply@olimp-avto.local}
    to: ${APP_MAIL_TO:olimpautovl125@gmail.com}
    lead-to: ${APP_MAIL_LEAD_TO:olimpautovl125@gmail.com,olimpauvtovl125@outlook.com}
