server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/olimp_avto
    username: olimp_avto
    password: olimp_avto
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 32MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          ssl:
            enable: ${MAIL_SMTP_SSL:false}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  auctions:
    api-url: ${AVTOJP_API_URL:http://78.46.90.228/gzip/}
    api-code: ${AVTOJP_API_CODE:}
    timeout: ${AVTOJP_TIMEOUT:5s}
    cache-ttl: ${AVTOJP_CACHE_TTL:10m}
  security:
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:admin123}
  mail:
    from: ${APP_MAIL_FROM:noreply@olimp-avto.local}
    to: ${APP_MAIL_TO:olimpautovl125@gmail.com}
