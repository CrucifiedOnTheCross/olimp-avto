server {
    listen 80;
    server_name olimpavtovl.ru www.olimpavtovl.ru;

    return 301 https://olimpavtovl.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.olimpavtovl.ru;

    ssl_certificate /etc/letsencrypt/live/olimpavtovl.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/olimpavtovl.ru/privkey.pem;

    return 301 https://olimpavtovl.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name olimpavtovl.ru;

    root /usr/share/nginx/html;
    index mainveb.html;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/olimpavtovl.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/olimpavtovl.ru/privkey.pem;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /swagger-ui.html {
        proxy_pass http://backend:8080/swagger-ui.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs/ {
        proxy_pass http://backend:8080/v3/api-docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /mainveb.html;
    }
}
